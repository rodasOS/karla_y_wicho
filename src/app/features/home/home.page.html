<section class="hero grid-bg" aria-labelledby="titulo">
  <p class="eyebrow pill pill-green"><span class="dot" aria-hidden="true"></span> Estadística Aplicada · UMG</p>
  <h1 id="titulo">Sigma <span class="gradient-text">Lab</span></h1>
  <p class="sub">{{ subtitle }}. Calcula, ve el procedimiento paso a paso y practica con ejercicios nuevos.</p>

  <form class="big-ask" role="search" (submit)="ask($event)">
    <label for="home-q" class="sr-only">Escribe tu pregunta</label>
    <input id="home-q" type="search" autocomplete="off" placeholder="Ej.: media y desviación estándar de 2.1, 2.3, 2.2, 2.4, 2.0" [value]="question()" (input)="question.set($any($event.target).value)" />
    <button type="submit" class="btn-primary"><app-icon name="search" [size]="18" /> Preguntar</button>
  </form>

  <div class="cta">
    <a class="btn-primary" routerLink="/descriptiva" [queryParams]="exampleParams"><app-icon name="flask" [size]="18" /> Probar con el ejemplo de corriente</a>
    <a class="btn-secondary" routerLink="/practicas"><app-icon name="target" [size]="18" /> Practicar</a>
  </div>
</section>

<section aria-labelledby="modulos">
  <h2 id="modulos" class="sec-title">¿Qué quieres <span class="gradient-text">calcular</span>?</h2>
  <ul class="cards">
    @for (c of cards; track c.path) {
      <li>
        <a class="card glass-card glass-card-hover" [routerLink]="c.path">
          <span class="icon-tile"><app-icon [name]="c.icon" [size]="24" /></span>
          <span class="txt">
            <strong>{{ c.label }}</strong>
            <span>{{ c.description }}</span>
          </span>
          <app-icon class="go" name="arrow" [size]="18" />
        </a>
      </li>
    }
  </ul>
</section>
